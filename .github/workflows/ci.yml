name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite relanzar el deploy a mano desde la pestaña Actions

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lixus
          POSTGRES_PASSWORD: changeme_local
          POSTGRES_DB: platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lixus -d platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: lixus
      DB_PASSWORD: changeme_local
      DB_NAME: platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_jwt_secret_not_for_prod
      DEV_PASSWORD_HASH: changeme_do_not_use_in_prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database (schema, roles, extensions)
        run: psql -h localhost -p 5433 -U lixus -d platform -v ON_ERROR_STOP=1 -f ../infra/docker/postgres/init/01-init.sql
        env:
          PGPASSWORD: changeme_local

      - name: Apply platform migrations
        run: alembic -c migrations/platform/alembic.ini upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  # ---------------------------------------------------------------------------
  # CD: solo en push a develop (o manual) y solo si los tres jobs pasaron.
  # Despliega por SSH con una clave dedicada que, en el servidor, solo puede
  # ejecutar `sudo /opt/lixus/ops/deploy.sh` (ver ops/deploy.sh).
  #
  # Si algun dia la cuenta AWS permite OIDC + roles IAM, este paso se puede
  # sustituir por SSM Run Command y cerrar el puerto 22.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script_stop: true
          script: |
            set -eu
            sudo /opt/lixus/ops/deploy.sh develop
