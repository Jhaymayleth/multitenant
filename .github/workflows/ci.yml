name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite relanzar el deploy a mano desde la pestaña Actions

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lixus
          POSTGRES_PASSWORD: changeme_local
          POSTGRES_DB: platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lixus -d platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: lixus
      DB_PASSWORD: changeme_local
      DB_NAME: platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_jwt_secret_not_for_prod
      DEV_PASSWORD_HASH: changeme_do_not_use_in_prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database (schema, roles, extensions)
        run: psql -h localhost -p 5433 -U lixus -d platform -v ON_ERROR_STOP=1 -f ../infra/docker/postgres/init/01-init.sql
        env:
          PGPASSWORD: changeme_local

      - name: Apply platform migrations
        run: alembic -c migrations/platform/alembic.ini upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  # ---------------------------------------------------------------------------
  # CD: solo en push a develop y solo si los tres jobs anteriores pasaron.
  # No abre SSH: usa SSM Run Command sobre la instancia EC2.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    permissions:
      id-token: write # necesario para asumir el rol con OIDC (sin claves de larga vida)
      contents: read
    env:
      AWS_REGION: us-east-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Credenciales AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Desplegar en la instancia (SSM Run Command)
        run: |
          set -euo pipefail
          echo "Commit a desplegar: ${GITHUB_SHA::7}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands='[
              "set -e",
              "cd /opt/lixus",
              "git fetch --prune origin",
              "git reset --hard origin/develop",
              "docker compose -f docker-compose.prod.yml build",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "docker exec lixus-nginx nginx -t",
              "docker exec lixus-nginx nginx -s reload",
              "sleep 5",
              "curl -fsS https://lixus.coderhivex.com/health"
            ]' \
            --query "Command.CommandId" --output text)

          echo "CommandId: ${CMD_ID}"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              Success)
                echo "--- salida del servidor ---"
                aws ssm get-command-invocation --command-id "${CMD_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" --output text
                exit 0
                ;;
              *)
                echo "Deploy falló con estado: ${STATUS}"
                aws ssm get-command-invocation --command-id "${CMD_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
          done

          echo "Timeout esperando el comando SSM"
          exit 1
