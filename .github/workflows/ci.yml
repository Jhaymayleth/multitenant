name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lixus
          POSTGRES_PASSWORD: changeme_local
          POSTGRES_DB: platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lixus -d platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: lixus
      DB_PASSWORD: changeme_local
      DB_NAME: platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_jwt_secret_not_for_prod
      DEV_PASSWORD_HASH: changeme_do_not_use_in_prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database (schema, roles, extensions)
        run: psql -h localhost -p 5433 -U lixus -d platform -v ON_ERROR_STOP=1 -f ../infra/docker/postgres/init/01-init.sql
        env:
          PGPASSWORD: changeme_local

      - name: Apply platform migrations
        run: alembic -c migrations/platform/alembic.ini upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
