[project]
name = "lixus-backend"
version = "0.1.0"
description = "Backend multitenant de Lixus API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: pruebas que requieren PostgreSQL",
    "security: pruebas de seguridad y aislamiento entre tenants",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

