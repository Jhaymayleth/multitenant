# -----------------------------------------------------------------------------
# Lixus — Entorno Local Multitenant
# -----------------------------------------------------------------------------
# Servicios:
#   - postgres (PostgreSQL 16 con extensiones y schema platform)
#   - redis (Redis 7 para rate limit y caché)
#   - backend (FastAPI + Python 3.12)
#   - frontend (Next.js 15 + React 19)
#
# Para levantar el entorno:
#   docker compose up --build
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: lixus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lixus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local}
      POSTGRES_DB: ${DB_NAME:-platform}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lixus} -d ${DB_NAME:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lixus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lixus-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_HOST: "0.0.0.0"
      APP_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lixus}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_local}
      DB_NAME: ${DB_NAME:-platform}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_do_not_use_in_prod}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lixus-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
