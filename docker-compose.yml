# -----------------------------------------------------------------------------
# Lixus — entorno local mínimo
# -----------------------------------------------------------------------------
# Servicios iniciales:
#   - postgres
#   - redis
#   - backend (FastAPI)
#   - frontend (Next.js)
#
# Este compose es el punto de partida. Los servicios exactos de frontend y
# backend se ajustan según la estructura real del monorepo/polyrepo que se
# defina en la fase 1.1.
# -----------------------------------------------------------------------------

version: "3.9"

x-shared-env: &shared-env
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: lixus-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:lixus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:changeme_local}
      POSTGRES_DB: ${DB_NAME:platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:lixus} -d ${DB_NAME:platform}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lixus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: python:3.12-slim
    container_name: lixus-backend
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    profiles:
      - dev

  frontend:
    image: node:20-alpine
    container_name: lixus-frontend
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      # Next necesita saber la URL base pública en dev.
      # En local usamos la variable genérica; la derivamos en el compose si es necesario.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_started
    command: >
      sh -c "
        npm install &&
        npm run dev -- -p 3000
      "
    profiles:
      - dev

volumes:
  postgres_data:
