# =============================================================================
# Lixus · Nginx (producción)
# Montado en: /etc/nginx/conf.d/default.conf
# =============================================================================

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lixus_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream lixus_backend {
    server backend:8000;
    keepalive 32;
}

# --- :80 · reto ACME + redirección a HTTPS -----------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name lixus.coderhivex.com;

    location ^~ /.well-known/acme-challenge/ {
        root      /var/www/certbot;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 · aplicación -------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name lixus.coderhivex.com;

    ssl_certificate     /etc/letsencrypt/live/lixus.coderhivex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lixus.coderhivex.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- FastAPI -------------------------------------------------------------
    location /api/ {
        proxy_pass         http://lixus_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass         http://lixus_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Next.js -------------------------------------------------------------
    location / {
        proxy_pass         http://lixus_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Proxy             "";
        proxy_cache_bypass $http_upgrade;
        proxy_redirect     off;
        proxy_hide_header  X-Powered-By;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
